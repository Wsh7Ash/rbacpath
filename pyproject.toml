[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbacpath"
version = "1.0.0"
description = "Offline auditor for Kubernetes RBAC semantics and workload escalation paths"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Wsh7Ash" }]
keywords = ["kubernetes", "rbac", "security", "least-privilege", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Security",
]

[project.scripts]
rbacpath = "rbacpath.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
